name: Mise à jour des articles

on:
  schedule:
    - cron: "17,47 * * * *"   # toutes les heures
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte des flux
        env:
          # Optionnel : résumés reformulés par Claude (secret à créer dans les réglages du dépôt)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py
      - name: Publier les nouvelles données
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || (git commit -m "Mise à jour des articles" && git push)
