name: Mise à jour des articles

on:
  schedule:
    - cron: "10,25,40,55 * * * *"   # toutes les heures
  workflow_dispatch:        # lancement manuel possible

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collecte des flux
        env:
          # Optionnel : résumés reformulés par Claude (secret à créer dans les réglages du dépôt)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py
      - name: Publier les nouvelles données
        run: |
          git config user.name "newsletter-bot"
          git config user.email "newsletter-bot@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Mise à jour des articles"
          # Si quelqu'un a modifié le dépôt entre-temps, on récupère ses changements puis on réessaie.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
